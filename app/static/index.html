<!DOCTYPE html>
<html>
<head>
    <title>MLOps Co-Pilot – Mohsen Mostafa</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">
    <h1>🔧 Multimodal MLOps Co-Pilot</h1>
    <p class="text-muted">Upload your architecture sketch + config file and ask a performance question.</p>

    <form id="analysisForm" enctype="multipart/form-data">
        <div class="mb-3">
            <label class="form-label">Hand-drawn architecture sketch (PNG/JPG)</label>
            <input type="file" class="form-control" name="image" accept="image/*" required>
        </div>
        <div class="mb-3">
            <label class="form-label">CI/CD config (e.g., docker-compose.yml, Dockerfile)</label>
            <textarea class="form-control" name="config" rows="8" placeholder="Paste your configuration here..." required></textarea>
        </div>
        <div class="mb-3">
            <label class="form-label">Your question</label>
            <input type="text" class="form-control" name="question" 
                   value="How can I reduce the p99 API latency of this RAG system to under 100ms?" required>
        </div>
        <button type="submit" class="btn btn-primary">Ask Mohsen's Co-Pilot</button>
    </form>

    <div id="answerBox" class="mt-4 p-3 border bg-light" style="display:none;"></div>

    <script>
        document.getElementById('analysisForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const response = await fetch('/analyze', { method: 'POST', body: formData });
            const data = await response.json();
            const box = document.getElementById('answerBox');
            box.style.display = 'block';
            box.innerHTML = `<h5>Answer:</h5><pre>${data.answer}</pre>`;
        });
    </script>
</body>
</html>
